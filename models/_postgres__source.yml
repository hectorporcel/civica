version: 2

sources:
  - name: POSTGRES     # Nombre interno para dbt
    database: DB24_BRONZE_DB   # Tu base de datos real en Snowflake
    schema: POSTGRES     # Tu esquema real en Snowflake 
    
    quoting:
      database: false
      schema: false
      identifier: false 
    config:   
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour} 

    tables:
      
      - name: ADDRESSES # El nombre de la tabla que creaste en Snowflake 
        columns:
          - name: ADRESS
          - name: ADRESS_ID
          - name: COUNTRY
          - name: STATE
          - name: ZIPCODE
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: ORDERS # El nombre de la tabla que creaste en Snowflake 
        columns:
          - name: ADRESS_ID
          - name: CREATED_AT
          - name: DELIVERED_AT
          - name: ESTIMATED_DELIVERY_AT
          - name: ORDER_COST
          - name: ORDER_ID
          - name: ORDER_TOTAL
          - name: PROMO_ID
          - name: SHIPPING_COST
          - name: SHIPPING_SERVICE
          - name: STATUS
          - name: TRACKING_ID
          - name: USER_ID
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: USER # El nombre de la tabla que creaste en Snowflake 
        columns:
          - name: ADDRESS_ID
          - name: CREATED_AT
          - name: EMAIL
          - name: FIRST_NAME
          - name: LAST_NAME
          - name: PHONE_NUMBER
          - name: TOTAL_ORDERS
          - name: UPDATED_AT
          - name: USER_ID
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: ORDER_ITEMS # El nombre de la tabla que creaste en Snowflake 
        columns:
          - name: ORDER_ID
          - name: PRODUCT_ID
          - name: QUANTITY
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
          
      - name: PRODUCTS          # El nombre de la tabla que creaste en Snowflake
        columns:
          - name: PRODUCT_ID
          - name: PRICE
          - name: NAME
          - name: INVENTORY
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: PROMOS          # El nombre de la tabla que creaste en Snowflake
        columns:
          - name: PROMO_ID
          - name: DISCOUNT
          - name: STATUS
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
        
        

      
          