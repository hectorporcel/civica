version: 2

models:
  - name: stg_POSTGRES_PRODUCTS # Nombre del modelo, aqui va el stg_POSTGRES_PRODUCTS
    config: 
      contract:          #Contratos, caracteristicas que hay que cumplir
        enforced: true   #Las condiciones a verdadero, se refiere a las constraints.
    description: >
      Data about all products in demo.

    columns:
      - name: product_id  #nombre de la columna.
        data_type: text   #tipo de dato de la columna.
        description: >    #descripcion.
          UUID for each unique product on platform.
        data_tests:       #test, dice que no haya nulos,
          - not_null
        constraints:      
          - type: not_null

      - name: product_name
        data_type: text
        description: >
          Name of the product.
        constraints:
          - type: not_null

      - name: unit_price_usd
        data_type: real
        description: >
          Price of the product.
        constraints:
          - type: not_null

      - name: inventory
        data_type: number
        description: >
          Amount of the inventory we have for this product.
        constraints:
          - type: not_null

      - name: date_load
        data_type: timestamp_tz
        description: >
          Date that the data was loaded.
        constraints:
          - type: not_null